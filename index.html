<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SOP Notes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>SOP Notes</title>
<!--
  X Vans SOP Notes v2 (2026-10-29). Stephan's one-screen note taker for SOPs, notes for AI only.
  Opens on the camera. Mic button starts muted; tap = listen (Safari speech recognition) until tapped again.
  Shoot -> scribble red -> Next. Pictures are numbered 1..n; what he says goes to the picture he's on.
  Pictures wait on the phone (IndexedDB) while he shoots; they upload when he mutes the mic, opens the
  notepad, taps Done, or leaves the app. Never in the background while shooting.
  No name or category: he says them, SOP Master pulls them from the transcript at sync.
  Top left = notepad (his SOPs, pictures + text, edit). Done = Status NEW, hands off to SOP Master.
  v2.1: coming back to the app (unlock / switch back) always lands on the live camera of the SOP he was
  on, mic back on if it was on. A picture he was still marking when he left is kept as-is.
  Notepad: tap an SOP = back to the camera adding pictures to it (no loading). Sent ones not synced yet
  reopen (reopenCapture). Other unfinished SOPs wait under "In progress". The pictures icon = view/edit.
  v2.3: each waiting picture knows its own SOP (lid), so switching SOPs or "New SOP" never waits for uploads.
  v2.4: notepad, tap a picture = fix its red marks (undo, eraser, clear, draw more), saved in the background.
  v2.5: notepad, in-progress SOP: swipe right = send to SOP Master (clicks at the send point), swipe left = Delete
  (asks first; folder goes to the Drive trash, deleteCapture). Camera "Next" is now "Save".
  v2.6: camera roll picks several pictures at once; each opens in turn to mark + talk, Save = next one,
  Retake = skip it. Notepad: typing under a picture shows a Save button. After a camera roll picture, Save opens the camera roll again for the next one (X = camera).
  Saves through the SOP Master App (Apps Script doPost) into a CAPTURE folder in SOP Inbox.
  Private key comes in the link (?k=...) and is kept in localStorage. Nothing secret lives in this file.
-->
<style>
:root{--line:rgba(255,255,255,.14);--glass:rgba(22,22,24,.62);--muted:rgba(255,255,255,.55);--red:#ff3b30}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:#000;color:#fff;font:16px/1.4 -apple-system,"SF Pro Display",system-ui,sans-serif;overflow:hidden;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.glass{background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(20px) saturate(1.4);backdrop-filter:blur(20px) saturate(1.4)}
.pill{border-radius:999px;padding:12px 22px;font-weight:600;letter-spacing:.01em}
.pill.white{background:#fff;color:#000;border-color:#fff}
.round{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center}

/* ---------- camera / scribble ---------- */
#cam{position:fixed;inset:0}
#stage{position:absolute;inset:0;background:#000}
#stage video,#stage canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
#stage canvas{touch-action:none;display:none}
.topbar{position:absolute;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top)) 14px 0;display:flex;align-items:center;gap:10px;z-index:3}
.topbar .mid{flex:1;text-align:center;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.topbar .mid b{color:#fff;font-weight:600}
.count{font-variant-numeric:tabular-nums}
#transcript{position:absolute;left:14px;right:14px;bottom:calc(128px + env(safe-area-inset-bottom));z-index:3;border-radius:18px;padding:10px 14px;font-size:15px;line-height:1.35;max-height:5.6em;overflow:hidden;display:none}
#transcript .n{color:var(--muted);font-size:12px;letter-spacing:.12em;text-transform:uppercase;display:block;margin-bottom:2px}
#transcript i{color:var(--muted);font-style:normal}
.bottombar{position:absolute;left:0;right:0;bottom:0;padding:0 26px calc(22px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:space-between;z-index:3}
.shutter{width:78px;height:78px;border-radius:50%;border:3px solid #fff;display:flex;align-items:center;justify-content:center}
.shutter i{display:block;width:62px;height:62px;border-radius:50%;background:#fff;transition:transform .1s}
.shutter:active i{transform:scale(.88)}
.mic{position:relative}
.mic.live{background:var(--red);border-color:var(--red);box-shadow:0 0 0 0 rgba(255,59,48,.6);animation:ring 1.6s infinite}
@keyframes ring{70%{box-shadow:0 0 0 16px rgba(255,59,48,0)}100%{box-shadow:0 0 0 0 rgba(255,59,48,0)}}
.mic .slash{display:block}
.mic.live .slash{display:none}
.hint{position:absolute;left:0;right:0;top:46%;text-align:center;color:var(--muted);font-size:15px;padding:0 30px;z-index:2}
.toast{position:absolute;left:50%;top:calc(64px + env(safe-area-inset-top));transform:translateX(-50%);z-index:5;border-radius:999px;padding:8px 16px;font-size:14px;white-space:nowrap;display:none}
.toast.err{background:var(--red);border-color:var(--red)}

/* ---------- notepad ---------- */
#pad{position:fixed;inset:0;background:#000;overflow-y:auto;-webkit-overflow-scrolling:touch;display:none;z-index:6}
#pad *{-webkit-user-select:text;user-select:text}
.padhead{position:sticky;top:0;z-index:2;padding:calc(10px + env(safe-area-inset-top)) 14px 12px;display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.72);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-bottom:1px solid var(--line)}
.padhead h1{flex:1;margin:0;font-size:17px;font-weight:600;letter-spacing:.02em;text-align:center}
.padbody{padding:16px 14px calc(40px + env(safe-area-inset-bottom))}
.sec{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:22px 4px 10px}
.sop{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border-radius:20px;padding:14px 16px;margin:0 0 10px;background:#111;border:1px solid var(--line)}
.sop .t{flex:1;min-width:0}
.sop .t b{display:block;font-weight:600}
.sop .t small{color:var(--muted);font-size:13px}
.card{display:flex;gap:8px;align-items:stretch;margin:0 0 10px}
.card .sop{margin:0}
.card .view{flex:none;width:58px;border-radius:20px;background:#111;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.tag{font-size:11px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--muted)}
.tag.rec{color:#fff;border-color:var(--red);background:rgba(255,59,48,.18)}
.pic{background:#111;border:1px solid var(--line);border-radius:20px;overflow:hidden;margin:0 0 12px}
.pic .img{position:relative;aspect-ratio:4/3;background:#0a0a0a center/contain no-repeat;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px}
.pic .num{position:absolute;left:10px;top:10px;min-width:30px;height:30px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;padding:0 9px}
.pic .row{display:flex;gap:8px;padding:10px}
.pic textarea{flex:1;min-height:76px;background:transparent;border:0;color:#fff;font:inherit;font-size:15px;resize:vertical;outline:none;padding:4px 2px}
.pic .save{display:none;margin:0 10px 12px auto;padding:10px 26px;font-size:15px}
.pic .save.show{display:block}
.pic .del{color:var(--muted);align-self:flex-start;padding:6px}
.pic .del.sure{color:var(--red)}
.padbtn{display:block;width:100%;text-align:center;margin:16px 0 0}
.empty{color:var(--muted);text-align:center;margin:60px 20px}
.pic .img.tap{cursor:pointer}
.pic .pen{position:absolute;right:10px;top:10px;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.pic .pen svg{width:18px;height:18px}
#mark{position:fixed;inset:0;z-index:8;background:#000;display:none}
#mark canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;touch-action:none}
.round.on{background:#fff;color:#000;border-color:#fff}
.swipe{position:relative;margin:0 0 10px;border-radius:20px;overflow:hidden;touch-action:pan-y}
.swipe .card{position:relative;margin:0;background:#000;will-change:transform}
.under{position:absolute;inset:0;display:flex;align-items:center;border-radius:20px;opacity:0}
.under.send{background:#1c7a43;padding-left:22px;gap:10px;font-weight:600;transition:background .15s}
.under.send svg{width:28px;height:28px;stroke-width:2.2;transition:transform .25s cubic-bezier(.3,1.8,.5,1)}
.under.send.armed{background:#2fbf68}
.under.send.armed svg{transform:scale(1.35)}
.under.del{background:var(--red);justify-content:flex-end}
.under.del button{width:96px;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:13px;font-weight:600}
.sheetbg{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;margin:0 10px calc(10px + env(safe-area-inset-bottom));border-radius:24px;padding:20px;text-align:center}
.sheet b{display:block;font-size:17px;margin-bottom:4px}
.sheet p{margin:0 0 16px;color:var(--muted);font-size:14px}
.sheet .pill{display:block;width:100%;margin-top:8px}
.pill.red{background:var(--red);border-color:var(--red);color:#fff}
.busy{position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;font-weight:600}
</style>
</head>
<body>

<div id="cam">
  <div id="stage">
    <video id="vid" playsinline muted autoplay></video>
    <canvas id="cv"></canvas>
  </div>
  <div class="hint" id="hint"></div>

  <div class="topbar">
    <button class="round glass" onclick="openPad()" aria-label="SOP notepad">
      <svg viewBox="0 0 24 24"><path d="M7 4h10a2 2 0 0 1 2 2v13a1 1 0 0 1-1 1H7a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/><path d="M9 9h6M9 13h6M9 17h3"/></svg>
    </button>
    <div class="mid" id="mid"></div>
    <button class="pill glass" id="doneB" onclick="done()" style="visibility:hidden">Done</button>
  </div>

  <div id="transcript" class="glass"></div>
  <div class="toast glass" id="toast"></div>

  <!-- camera mode -->
  <div class="bottombar" id="shootBar">
    <button class="round glass" onclick="pickPhoto()" aria-label="Camera roll">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M20.5 16l-5-5-8.5 8.5"/></svg>
    </button>
    <button class="shutter" onclick="shoot()" aria-label="Take picture"><i></i></button>
    <button class="round glass mic" onclick="toggleMic()" aria-label="Microphone">
      <svg viewBox="0 0 24 24"><rect x="9" y="3.5" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v2.5"/><path class="slash" d="M4 4l16 16"/></svg>
    </button>
  </div>

  <!-- scribble mode -->
  <div class="bottombar" id="drawBar" style="display:none">
    <div style="display:flex;gap:10px">
      <button class="round glass" onclick="retake()" aria-label="Retake">
        <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/></svg>
      </button>
      <button class="round glass" onclick="undo()" aria-label="Undo mark">
        <svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-2"/></svg>
      </button>
    </div>
    <button class="pill white" style="padding:16px 34px;font-size:17px" onclick="next()">Save&nbsp;&nbsp;✓</button>
    <button class="round glass mic" onclick="toggleMic()" aria-label="Microphone">
      <svg viewBox="0 0 24 24"><rect x="9" y="3.5" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v2.5"/><path class="slash" d="M4 4l16 16"/></svg>
    </button>
  </div>
</div>

<div id="pad"></div>

<!-- fix the red marks on a saved picture -->
<div id="mark">
  <canvas id="mcv"></canvas>
  <div class="topbar">
    <button class="pill glass" onclick="markClose()">Cancel</button>
    <div class="mid" id="markMid"></div>
    <button class="pill white" onclick="markSave()">Save</button>
  </div>
  <div class="bottombar" style="justify-content:center;gap:14px">
    <button class="round glass" onclick="markUndo()" aria-label="Undo mark">
      <svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-2"/></svg>
    </button>
    <button class="round glass" id="eraseB" onclick="markErase()" aria-label="Eraser: tap a mark to remove it">
      <svg viewBox="0 0 24 24"><path d="M8.5 19.5l-4-4a1.5 1.5 0 0 1 0-2.1l9-9a1.5 1.5 0 0 1 2.1 0l4 4a1.5 1.5 0 0 1 0 2.1L12 18.1"/><path d="M8.5 19.5H20M8 10l6 6"/></svg>
    </button>
    <button class="round glass" onclick="markClear()" aria-label="Clear all marks">
      <svg viewBox="0 0 24 24"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"/></svg>
    </button>
    <button class="round glass on" id="drawB" onclick="markDraw()" aria-label="Red pen">
      <svg viewBox="0 0 24 24"><path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 0 1 3 3L8 19z"/><path d="M14.5 6.5l3 3"/></svg>
    </button>
  </div>
</div>
<div class="busy" id="busy"></div>
<div class="sheetbg" id="sheet" onclick="if(event.target===this)sheetClose()"><div class="sheet glass" id="sheetBody"></div></div>
<input type="file" id="pick" accept="image/*" multiple style="display:none">

<script>
var API = 'https://script.google.com/macros/s/AKfycbzx-xtTjzXE5mAeYwAYDLOIwW3QskPkgpMX5gTYdbfWQ8K87nN_GLMnrhtfyGvdnWGJ/exec';
var MAX_SIDE = 2000;     // photo long side saved to Drive
var PEN = 0.008;         // pen width, fraction of the photo's long side

var KEY = new URLSearchParams(location.search).get('k') || localStorage.getItem('capKey') || '';
if (KEY) localStorage.setItem('capKey', KEY);

// Current SOP: folder in SOP Inbox (created on the first save) and how many pictures it has.
var cur = JSON.parse(localStorage.getItem('curSop') || 'null');   // {lid, folderId, n, started}; lid = id on this phone
var sent = JSON.parse(localStorage.getItem('sentSops') || '[]');  // [{folderId, title, n, date}]
var paused = JSON.parse(localStorage.getItem('pausedSops') || '[]');  // other unfinished SOPs, same shape as cur
var held = [];                   // pictures taken but not uploaded yet: [{id, lid, f}]
if (cur && !cur.lid) cur.lid = 'l0';   // from before v2.3
paused.forEach(function (s, i) { if (!s.lid) s.lid = 'p' + i; delete s.sending; });
var queue = Promise.resolve();   // uploads run one after another
var saving = 0;
var shot = null;                 // {base canvas, strokes} while scribbling
var roll = [], rollN = 0;        // camera roll pictures still to mark, and how many were picked
var heard = '';                  // what was said for the picture we're on
var thumbs = {};

function $(id) { return document.getElementById(id); }
function esc(s) {
  return String(s || '').replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function stamp() {
  var d = new Date(), p = function (x) { return ('0' + x).slice(-2); };
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function saveState() {
  localStorage.setItem('curSop', JSON.stringify(cur));
  localStorage.setItem('sentSops', JSON.stringify(sent));
  localStorage.setItem('pausedSops', JSON.stringify(paused));
}

/** Calls a capture function in the SOP Master App. */
function call(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  return fetch(API, { method: 'POST', body: JSON.stringify({ fn: fn, key: KEY, args: args }) })
    .then(function (r) { return r.json(); })
    .then(function (r) { if (!r.ok) throw new Error(r.error); return r.data; });
}

var toastT;
function toast(t, err) {
  var el = $('toast');
  el.textContent = t;
  el.className = 'toast glass' + (err ? ' err' : '');
  el.style.display = 'block';
  clearTimeout(toastT);
  toastT = setTimeout(function () { el.style.display = 'none'; }, err ? 6000 : 1600);
}
function busy(t) { $('busy').textContent = t || ''; $('busy').style.display = t ? 'flex' : 'none'; }

// ---------- Camera ----------

var stream = null;

function startCamera() {
  $('cv').style.display = 'none';
  $('vid').style.display = 'block';
  $('shootBar').style.display = 'flex';
  $('drawBar').style.display = 'none';
  shot = null;
  roll = [];
  paintTop();
  if (stream) return;
  hint('');
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return hint('No camera here. Use the camera roll button.');
  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1440 } }, audio: false })
    .then(function (st) { stream = st; $('vid').srcObject = st; $('vid').play(); })
    .catch(function (e) { hint('Camera blocked (' + e.name + '). Allow the camera for this site, or use the camera roll button.'); });
}

function stopCamera() {
  if (stream) stream.getTracks().forEach(function (t) { t.stop(); });
  stream = null;
}

function hint(t) { $('hint').textContent = t || ''; }

function shoot() {
  var v = $('vid');
  if (!v.videoWidth) return;
  scribble(scaled(v, v.videoWidth, v.videoHeight));
}

function pickPhoto() { $('pick').click(); }
$('pick').onchange = function () {
  roll = Array.prototype.slice.call(this.files);
  rollN = roll.length;
  this.value = '';
  nextShot();
};

/** After Save or Retake: the next picked camera roll picture to mark, else back to the camera. */
function nextShot() {
  if (!roll.length) return startCamera();
  var f = roll.shift(), k = rollN - roll.length, url = URL.createObjectURL(f);
  loadSrc(url).then(function (c) {
    URL.revokeObjectURL(url);
    scribble(c);
    shot.roll = true;
    if (rollN > 1) hint('Camera roll ' + k + ' of ' + rollN);
  }).catch(function () { URL.revokeObjectURL(url); toast('Could not open that photo', true); nextShot(); });
}

// ---------- Scribble ----------

function scribble(base) {
  shot = { base: base, strokes: [], cur: null };
  var cv = $('cv');
  cv.width = base.width;
  cv.height = base.height;
  cv.style.display = 'block';
  $('vid').style.display = 'none';
  $('shootBar').style.display = 'none';
  $('drawBar').style.display = 'flex';
  hint('');
  redraw();
}

function retake() { afterShot(shot && shot.roll); }   // on a camera roll picture: skip it

/** Next picked picture; else the camera, and the camera roll opens again if this one came from it
 *  (must run inside the tap, iPhone only opens the picker on a tap). X in the picker = stay on the camera. */
function afterShot(wasRoll) {
  if (roll.length) return nextShot();
  startCamera();
  if (wasRoll) pickPhoto();
}

function undo() {
  if (!shot) return;
  shot.strokes.pop();
  redraw();
}

function redraw(target, s) {
  s = s || shot;
  var cv = target || $('cv'), g = cv.getContext('2d');
  g.drawImage(s.base, 0, 0);
  var L = Math.max(cv.width, cv.height);
  g.strokeStyle = '#ff2a2a';
  g.lineCap = g.lineJoin = 'round';
  s.strokes.concat(s.cur ? [s.cur] : []).forEach(function (st) {
    g.lineWidth = st.w * L;
    g.beginPath();
    st.pts.forEach(function (p, k) {
      var x = p[0] * cv.width, y = p[1] * cv.height;
      if (k) g.lineTo(x, y); else g.moveTo(x, y);
    });
    if (st.pts.length === 1) g.lineTo(st.pts[0][0] * cv.width + 0.1, st.pts[0][1] * cv.height);
    g.stroke();
  });
}

/** Finger position as 0..1 of the photo (the canvas is letterboxed by object-fit: contain). */
function photoPoint(cv, cx, cy) {
  var r = cv.getBoundingClientRect();
  var sc = Math.min(r.width / cv.width, r.height / cv.height);
  var w = cv.width * sc, h = cv.height * sc;
  var x = (cx - r.left - (r.width - w) / 2) / w, y = (cy - r.top - (r.height - h) / 2) / h;
  var c = function (v) { return Math.round(Math.min(1, Math.max(0, v)) * 1000) / 1000; };
  return [c(x), c(y)];
}

/** Red pen on a canvas; getShot() returns the {base, strokes, cur} being drawn on. */
function pen(cv, getShot, onDraw) {
  var down = false;
  function start(cx, cy) {
    var s = getShot(); if (!s) return; down = true;
    if (s.erase) return rub(s, cx, cy);
    s.cur = { w: PEN, pts: [photoPoint(cv, cx, cy)] }; onDraw();
  }
  /** Eraser: removes any mark the finger passes over. */
  function rub(s, cx, cy) {
    var p = photoPoint(cv, cx, cy), W = cv.width, H = cv.height, r = 0.035 * Math.max(W, H), n = s.strokes.length;
    var x = p[0] * W, y = p[1] * H;
    function near(a, b) {   // finger within r of the line a-b (pixels)
      var ax = a[0] * W, ay = a[1] * H, dx = b[0] * W - ax, dy = b[1] * H - ay, L = dx * dx + dy * dy;
      var t = L ? Math.max(0, Math.min(1, ((x - ax) * dx + (y - ay) * dy) / L)) : 0;
      return Math.hypot(ax + t * dx - x, ay + t * dy - y) < r;
    }
    s.strokes = s.strokes.filter(function (st) {
      return !st.pts.some(function (q, k) { return near(q, st.pts[k + 1] || q); });
    });
    if (s.strokes.length !== n) onDraw();
  }
  function move(cx, cy) {
    var s = getShot();
    if (!down || !s) return;
    if (s.erase) return rub(s, cx, cy);
    var p = photoPoint(cv, cx, cy), last = s.cur.pts[s.cur.pts.length - 1];
    if (Math.abs(p[0] - last[0]) + Math.abs(p[1] - last[1]) < 0.003) return;
    s.cur.pts.push(p);
    onDraw();
  }
  function end() { var s = getShot(); if (!down || !s) return; down = false; if (!s.cur) return; s.strokes.push(s.cur); s.cur = null; onDraw(); }
  cv.addEventListener('touchstart', function (e) { e.preventDefault(); start(e.touches[0].clientX, e.touches[0].clientY); }, { passive: false });
  cv.addEventListener('touchmove', function (e) { e.preventDefault(); move(e.touches[0].clientX, e.touches[0].clientY); }, { passive: false });
  cv.addEventListener('touchend', function (e) { e.preventDefault(); end(); }, { passive: false });
  cv.addEventListener('mousedown', function (e) { e.preventDefault(); start(e.clientX, e.clientY); });
  cv.addEventListener('mousemove', function (e) { move(e.clientX, e.clientY); });
  window.addEventListener('mouseup', end);
}
pen($('cv'), function () { return shot; }, function () { redraw(); });
pen($('mcv'), function () { return marking; }, function () { redraw($('mcv'), marking); });

/** Next: saves this picture with what was said for it, back to the camera for the next one. */
function next() {
  if (!shot) return;
  var wasRoll = shot.roll;
  keepShot();
  afterShot(wasRoll);
}

/** Holds the picture being marked, with what was said for it. */
function keepShot() {
  flushInterim();
  var f = { kind: 'step', caption: heard.trim(), photo: $('cv').toDataURL('image/jpeg', 0.85) };
  if (shot.strokes.length) { f.original = shot.base.toDataURL('image/jpeg', 0.85); f.strokes = shot.strokes; }
  heard = '';
  shot = null;
  hold(f);
  paintTranscript();
}

/** Keeps a picture on the phone until the next upload (mute, notepad, Done, leaving the app). */
function hold(f) {
  if (!cur) cur = { lid: newId(), folderId: '', n: 0, started: stamp() };
  cur.n++;
  saveState();
  var item = { id: newId(), lid: cur.lid, f: f };
  held.push(item);
  db('put', item);
  paintTop();
}

function newId() { return Date.now() + '-' + Math.random().toString(36).slice(2, 7); }

/** The SOP a waiting picture belongs to (current or paused). Never loses a picture: unknown -> new paused SOP. */
function sopOf(item) {
  var s = [cur].concat(paused).filter(function (x) { return x && x.lid === item.lid; })[0];
  if (!s) {
    s = { lid: item.lid || newId(), folderId: '', n: 1, started: stamp() };
    item.lid = s.lid;
    paused.push(s);
    saveState();
  }
  return s;
}
function waiting(lid) { return held.filter(function (i) { return i.lid === lid; }).length; }

/** Uploads the waiting pictures in order, each into its own SOP; starts an SOP's folder on its first one.
 *  Failed ones stay waiting. */
function flush() {
  queue = queue.then(function () {
    if (!held.length) return;
    var total = held.length, n = 0;
    saving = total;
    paintTop();
    toast('Saving ' + total + (total > 1 ? ' pictures…' : ' picture…'));
    return (function step() {
      if (!held.length) return;
      var item = held[0];
      if (gone[item.lid]) { held.shift(); db('delete', item.id); return step(); }
      var mine = sopOf(item);
      return (mine.folderId ? Promise.resolve() :
        call('startCapture', 'SOP ' + mine.started, 'not given (Stephan says it in the transcript)')
          .then(function (c) { mine.folderId = c.folderId; saveState(); })
      ).then(function () {
        return call('addStep', mine.folderId, item.f);
      }).then(function () {
        held = held.filter(function (x) { return x !== item; });
        db('delete', item.id);
        saving = held.length;
        paintTop();
        padRefresh();
        return step();
      });
    })().then(function () {
      saving = 0;
      paintTop();
      toast('Saved ✓');
    });
  }).catch(function (e) {
    saving = 0;
    paintTop();
    padRefresh();
    toast(held.length + ' not saved yet (' + e.message + '). Will retry.', true);
  });
  return queue;
}

/** Done: anything said after the last picture becomes a last note, then hand off to SOP Master. */
function done() {
  if (!cur) return;
  flushInterim();
  if (heard.trim()) { hold({ kind: 'step', caption: heard.trim() }); heard = ''; }
  setMic(false, true);
  busy('Sending to SOP Master…');
  sendSop(cur).then(function () {
    busy('');
    paintTranscript();
    toast('Sent ✓  Tell SOP Master: sync');
  }, function (e) { busy(''); toast('Not sent: ' + e.message, true); });
}

/** Hands one SOP to SOP Master (Status NEW) after its waiting pictures upload. If it was the current one,
 *  the next picture starts a new SOP; if sending fails it goes back where it was. */
function sendSop(s) {
  var wasCur = s === cur;
  if (wasCur) { paused.unshift(cur); cur = null; }
  s.sending = true;
  saveState(); paintTop(); padRefresh();
  return flush().then(function () {
    if (waiting(s.lid)) throw new Error('pictures still waiting to upload');
    if (!s.folderId) throw new Error('nothing saved yet');
    return call('finishCapture', s.folderId, '');
  }).then(function () {
    paused = paused.filter(function (x) { return x !== s; });
    sent.unshift({ folderId: s.folderId, title: 'SOP ' + s.started, n: s.n, date: stamp() });
    sent = sent.slice(0, 30);
    saveState(); paintTop(); padRefresh();
  }, function (e) {
    delete s.sending;
    if (wasCur && !cur) { paused = paused.filter(function (x) { return x !== s; }); cur = s; }
    saveState(); paintTop(); padRefresh();
    throw e;
  });
}

var gone = {};   // lids of deleted SOPs, so an upload already running can't bring them back

/** Deletes an unfinished SOP: its waiting pictures on the phone, and its Drive folder (to the trash). */
function deleteSop(lid) {
  var s = [cur].concat(paused).filter(function (x) { return x && x.lid === lid; })[0];
  if (!s) return;
  gone[lid] = true;
  if (s === cur) cur = null;
  paused = paused.filter(function (x) { return x !== s; });
  held.filter(function (i) { return i.lid === lid; }).forEach(function (i) { db('delete', i.id); });
  held = held.filter(function (i) { return i.lid !== lid; });
  saveState(); paintTop(); padRefresh();
  queue = queue.then(function () {   // after any upload into it finishes, so its folderId is known
    if (s.folderId) return call('deleteCapture', s.folderId);
  }).then(function () { toast('Deleted ✓'); }, function (e) { toast('Not deleted on Drive: ' + e.message, true); });
}

function paintTop() {
  var n = (cur ? cur.n : 0) + 1;
  $('mid').innerHTML = (cur ? 'SOP ' + esc(cur.started.slice(11)) + ' · ' : 'New SOP · ') + 'Picture <b class="count">' + n + '</b>' +
    (saving ? ' · saving ' + saving : held.length ? ' · ' + held.length + ' waiting' : '');
  $('doneB').style.visibility = cur ? 'visible' : 'hidden';
}

// ---------- Mic: Safari speech recognition, restarted whenever it stops, until muted ----------

var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
var micOn = false, rec = null, interim = '';
var autoMic = false;   // mic was turned back on by the app (not a tap); if Safari refuses, just stay muted

function toggleMic() { autoMic = false; setMic(!micOn); }

/** quiet = don't upload (caller uploads itself). Muting is the moment pictures upload. */
function setMic(on, quiet) {
  var was = micOn;
  if (on && !SR) { toast('No speech recognition in this browser. Open in Safari.', true); return; }
  micOn = on;
  localStorage.setItem('micOn', on ? '1' : '');
  Array.prototype.forEach.call(document.querySelectorAll('.mic'), function (b) { b.classList.toggle('live', on); });
  if (on) listen(); else stopListening();
  paintTranscript();
  wake(on);
  if (was && !on && !quiet) flush();
}

function listen() {
  if (!micOn || rec) return;
  var r = new SR(), used = 0;   // used = finals already taken (iOS re-sends old results, so count instead of trusting resultIndex)
  r.lang = 'en-US';
  r.continuous = true;
  r.interimResults = true;
  r.onresult = function (e) {
    var finals = [], mid = '';
    for (var k = 0; k < e.results.length; k++) {
      if (e.results[k].isFinal) finals.push(e.results[k][0].transcript); else mid += e.results[k][0].transcript;
    }
    autoMic = false;
    for (; used < finals.length; used++) addHeard(finals[used]);
    interim = mid;
    paintTranscript();
  };
  r.onerror = function (e) {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
      if (autoMic) { autoMic = false; setMic(false, true); toast('Tap the mic to listen'); return; }
      toast('Mic blocked: allow Microphone and Siri & Dictation for Safari', true);
      setMic(false);
    }
  };
  r.onend = function () {
    rec = null;
    flushInterim();
    if (micOn) setTimeout(listen, 250);
  };
  try { r.start(); rec = r; } catch (e) { setTimeout(listen, 500); }
}

function stopListening() {
  if (rec) { var r = rec; rec = null; r.onend = null; try { r.stop(); } catch (e) {} }
  flushInterim();
}

function addHeard(t) {
  t = String(t || '').trim();
  if (!t) return;
  var v = heard.replace(/\s+$/, '');
  if (!v || /[.!?]$/.test(v)) t = t.charAt(0).toUpperCase() + t.slice(1);
  heard = v ? v + ' ' + t : t;
}

/** Words still being heard count for the picture we're on. */
function flushInterim() {
  if (interim) { addHeard(interim); interim = ''; }
}

function paintTranscript() {
  var el = $('transcript');
  if (!micOn && !heard) { el.style.display = 'none'; return; }
  el.style.display = 'block';
  var n = (cur ? cur.n : 0) + 1;
  var txt = heard + (interim ? ' <i>' + esc(interim) + '</i>' : '');
  el.innerHTML = '<span class="n">Picture ' + n + (micOn ? ' · listening' : ' · muted') + '</span>' +
    (heard || interim ? esc(heard).slice(-400) + (interim ? ' <i>' + esc(interim) + '</i>' : '') : '<i>Talk: what this is, tools, parts and how many…</i>');
  el.scrollTop = el.scrollHeight;
}

var lock = null;
function wake(on) {
  try {
    if (on && navigator.wakeLock && !lock) navigator.wakeLock.request('screen').then(function (l) { lock = l; l.onrelease = function () { lock = null; }; });
    if (!on && lock) { lock.release(); lock = null; }
  } catch (e) {}
}

// ---------- Notepad: your SOPs, pictures and what you said ----------

var padSop = null;   // capture open in the notepad

function openPad() {
  setMic(false, true);
  stopCamera();
  $('pad').style.display = 'block';
  padList();
  if (held.length) flush();
}

function pics(n) { return n + (n === 1 ? ' picture' : ' pictures'); }

function padRefresh() {
  if ($('pad').style.display !== 'block' || padSop) return;
  if (dragging || openSwipe) { padStale = true; return; }   // don't redraw under his finger
  padList();
}

/** New SOP: the one he was on waits under "In progress"; the next picture starts a fresh SOP. */
function newSop() {
  if (cur) paused.unshift(cur);
  cur = null;
  saveState();
  closePad();
  toast('New SOP · Picture 1');
}

function closePad() {
  $('pad').style.display = 'none';
  padSop = null;
  startCamera();
}

function padList() {
  padSop = null;
  var h = '<div class="padhead"><button class="round glass" onclick="closePad()" aria-label="Camera">' +
    '<svg viewBox="0 0 24 24"><path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h1.8l1.4-2h4.6l1.4 2h1.8A2.5 2.5 0 0 1 20 8.5v8a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 16.5z"/><circle cx="12" cy="12.5" r="3.5"/></svg></button>' +
    '<h1>SOP Notes</h1><button class="pill white" onclick="newSop()">+ New SOP</button></div><div class="padbody">';
  var going = [cur].concat(paused).filter(function (s) { return s && !s.sending; });
  var sending = paused.filter(function (s) { return s.sending; }).length;
  if (going.length) {
    h += '<div class="sec">In progress · swipe → send · ← delete</div>' + going.map(function (s) {
      var w = waiting(s.lid);
      return '<div class="swipe" data-lid="' + s.lid + '">' +
        '<div class="under send"><svg viewBox="0 0 24 24"><path d="M4.5 12.5l5 5 10-11"/></svg>Send to SOP Master</div>' +
        '<div class="under del"><button onclick="askDelete(\'' + s.lid + '\')"><svg viewBox="0 0 24 24"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"/></svg>Delete</button></div>' +
        card("addTo('" + s.lid + "')", "padOpen('" + s.folderId + "', true, '" + s.lid + "')", 'SOP ' + s.started,
          pics(s.n) + (w ? ' · ' + w + ' uploading' : ''), s === cur ? 'Now' : 'Recording', true) + '</div>';
    }).join('');
  }
  if (sending) h += '<p class="empty" style="margin:4px 0 10px">Sending ' + sending + ' to SOP Master…</p>';
  if (sent.length) {
    h += '<div class="sec">Sent to SOP Master · tap to add more</div>' + sent.map(function (s) {
      return card("reopen('" + s.folderId + "')", "padOpen('" + s.folderId + "', false)", s.title, pics(s.n) + ' · sent ' + s.date, 'Sent', false);
    }).join('');
  }
  if (!going.length && !sent.length && !sending) h += '<p class="empty">No SOPs yet.<br>Go back to the camera, tap the mic, and start shooting.</p>';
  $('pad').innerHTML = h + '</div>';
  openSwipe = null;
  Array.prototype.forEach.call(document.querySelectorAll('.swipe'), swipeRow);

// ---------- Swipe an in-progress SOP: right = send to SOP Master, left = show Delete ----------

var openSwipe = null, dragging = false, padStale = false;

/** A click you can feel: Android vibrates; iPhone (iOS 18+) ticks when a hidden switch is toggled. */
var tick = document.createElement('label');
tick.innerHTML = '<input type="checkbox" switch>';
tick.style.display = 'none';
document.body.appendChild(tick);
function haptic() { try { if (navigator.vibrate) navigator.vibrate(12); else tick.click(); } catch (e) {} }

function closeSwipe() {
  var row = openSwipe;
  openSwipe = null;
  if (row) {
    var card = row.querySelector('.card');
    card.style.transition = 'transform .35s cubic-bezier(.2,.9,.3,1.15)';
    card.style.transform = 'translateX(0)';
    row.classList.remove('open');
  }
  if (padStale) { padStale = false; setTimeout(padRefresh, 360); }
}

function swipeRow(row) {
  var card = row.querySelector('.card'), sendU = row.querySelector('.under.send'), delU = row.querySelector('.under.del');
  var D = 96, x0 = null, y0, base, dx = 0, mode = null, armed = false, pid = null, swiped = false;
  function W() { return row.offsetWidth; }
  function T() { return Math.max(110, W() * 0.38); }   // send point
  function set(x, anim) {
    card.style.transition = anim ? 'transform .35s cubic-bezier(.2,.9,.3,1.15)' : 'none';
    card.style.transform = 'translateX(' + x + 'px)';
    sendU.style.opacity = x > 0 ? 1 : 0;
    delU.style.opacity = x < 0 ? 1 : 0;
  }
  row.addEventListener('pointerdown', function (e) {
    swiped = false;
    if (openSwipe && openSwipe !== row) closeSwipe();
    x0 = e.clientX; y0 = e.clientY; pid = e.pointerId; mode = null; dx = 0;
    base = row.classList.contains('open') ? -D : 0;
  });
  row.addEventListener('pointermove', function (e) {
    if (x0 === null || e.pointerId !== pid) return;
    var mx = e.clientX - x0, my = e.clientY - y0;
    if (!mode) {
      if (Math.abs(mx) < 8 && Math.abs(my) < 8) return;
      if (Math.abs(my) > Math.abs(mx)) { x0 = null; return; }   // scrolling the list
      mode = 'x'; dragging = true;
      try { row.setPointerCapture(pid); } catch (err) {}
    }
    dx = base + mx;
    if (dx > 0) {
      var a = dx > T();
      if (a !== armed) { armed = a; sendU.classList.toggle('armed', a); haptic(); }
      set(a ? dx + 14 : dx);   // jumps a little at the send point: the "click"
    } else {
      if (armed) { armed = false; sendU.classList.remove('armed'); }
      set(dx < -D ? -D + (dx + D) * 0.3 : dx);
    }
  });
  function up(e) {
    if (e.pointerId !== pid) return;
    var was = mode;
    x0 = null; mode = null; dragging = false;
    if (!was) return;
    swiped = true;
    if (dx > 0 && armed) return fly();
    armed = false; sendU.classList.remove('armed');
    if (dx < -D / 2) { set(-D, true); row.classList.add('open'); openSwipe = row; haptic(); }
    else { set(0, true); row.classList.remove('open'); if (openSwipe === row) openSwipe = null; if (padStale) closeSwipe(); }
  }
  row.addEventListener('pointerup', up);
  row.addEventListener('pointercancel', up);

  row.addEventListener('click', function (e) {

    if (row.classList.contains('open') && !e.target.closest('.under.del')) { e.stopPropagation(); e.preventDefault(); closeSwipe(); }
  }, true);
  function fly() {
    var lid = row.getAttribute('data-lid');
    card.style.transition = 'transform .24s cubic-bezier(.5,0,.9,.4)';
    card.style.transform = 'translateX(' + (W() + 40) + 'px)';
    setTimeout(function () {
      row.style.height = row.offsetHeight + 'px';
      row.offsetHeight;
      row.style.transition = 'height .22s ease, margin .22s ease';
      row.style.height = '0px';
      row.style.marginBottom = '0px';
    }, 240);
    setTimeout(function () {
      var s = [cur].concat(paused).filter(function (x) { return x && x.lid === lid; })[0];
      if (!s) return;
      sendSop(s).then(function () { toast('Sent ✓  Tell SOP Master: sync'); }, function (err) { toast('Not sent: ' + err.message, true); });
    }, 480);
  }
}

/** Makes this unfinished SOP the one new pictures go into and goes back to the camera. Instant. */
function addTo(lid) {

/** A sent one is reopened first (only if SOP Master hasn't synced it yet), then pictures go into it. */

function padShow() {

      (s.photoId ? (thumbs[s.photoId] ? '' : 'loading…') : 'no picture') + '</div>' +

      '</div>' + (c.editable ? '<button class="pill white save" data-i="' + i + '">Save&nbsp;&nbsp;✓</button>' : '') + '</div>';

  else if (!c.steps.length) h += '<p class="empty">No pictures yet.</p>';
  var mine = [cur].concat(paused).filter(function (x) { return x && x.folderId === c.folderId; })[0];
  if (c.editable && mine) h += '<button class="pill white padbtn" onclick="addTo(\'' + mine.lid + '\')">Add pictures</button>';
  $('pad').innerHTML = h + '</div>';

  Array.prototype.forEach.call(document.querySelectorAll('.pic .img[data-i]'), function (el) {
    var i = Number(el.getAttribute('data-i')), s = c.steps[i];
    if (!s.photoId || thumbs[s.photoId]) return;
    call('getStepPhoto', c.folderId, i, 'thumb').then(function (uri) {
      thumbs[s.photoId] = uri;
      el.style.backgroundImage = 'url(' + uri + ')';
      el.lastChild.nodeType === 3 && el.removeChild(el.lastChild);
    }).catch(function () {});
  });
  // Typing shows a Save button under the text; tapping out of the box saves too.
  Array.prototype.forEach.call(document.querySelectorAll('.pic textarea'), function (ta) {
    var i = Number(ta.getAttribute('data-i')), btn = ta.parentNode.parentNode.querySelector('.save'), saved = ta.value, sending = null;
    if (!btn) return;
    function save() {
      var v = ta.value;
      if (v === saved || v === sending) return;   // tapping Save also blurs the box: save once
      sending = v;
      btn.textContent = 'Saving…';
      call('updateStep', c.folderId, i, { caption: v })
        .then(function (n) {
          saved = v; sending = null; padSop.steps = n.steps; toast('Saved ✓');
          btn.innerHTML = 'Save&nbsp;&nbsp;✓';
          btn.classList.toggle('show', ta.value !== saved);
        })
        .catch(function (e) { sending = null; btn.innerHTML = 'Save&nbsp;&nbsp;✓'; toast('Not saved: ' + e.message, true); });
    }
    ta.oninput = function () { btn.classList.toggle('show', ta.value !== saved); };
    ta.onchange = save;
    btn.onclick = function () { save(); ta.blur(); };
  });
  Array.prototype.forEach.call(document.querySelectorAll('.pic .del'), function (b) {
    b.onclick = function () {
      if (!b.classList.contains('sure')) { b.classList.add('sure'); toast('Tap again to delete'); return; }   // no confirm() popups
      busy('Deleting…');
      call('deleteStep', c.folderId, Number(b.getAttribute('data-i'))).then(function (n) {
        busy('');
        padSop.steps = n.steps;
        [cur].concat(paused).forEach(function (x) {
          if (x && x.folderId === c.folderId) { x.n = n.steps.length + waiting(x.lid); saveState(); }
        });
        padShow();
      }).catch(function (e) { busy(''); toast(e.message, true); });
    };
  });
}

// ---------- Fix the red marks on a saved picture: unmarked original + its marks, redrawn ----------

var marking = null;   // {base, strokes, cur, erase, i, folderId}

function markOpen(i) {
  var c = padSop, s = c.steps[i];
  busy('Loading picture…');
  call('getStepPhoto', c.folderId, i, 'original').then(loadSrc).then(function (base) {
    busy('');
    marking = { base: base, strokes: JSON.parse(JSON.stringify(s.strokes || [])), cur: null, erase: false, i: i, folderId: c.folderId };
    var cv = $('mcv');
    cv.width = base.width;
    cv.height = base.height;
    $('markMid').textContent = 'Picture ' + (i + 1);
    $('mark').style.display = 'block';
    markDraw();
  }).catch(function (e) { busy(''); toast('Could not open picture: ' + e.message, true); });
}

function markClose() { $('mark').style.display = 'none'; marking = null; }
function markUndo() { if (marking) { marking.strokes.pop(); redraw($('mcv'), marking); } }
function markClear() { if (marking) { marking.strokes = []; redraw($('mcv'), marking); } }
function markTool(erase) {
  marking.erase = erase;
  $('eraseB').classList.toggle('on', erase);
  $('drawB').classList.toggle('on', !erase);
  redraw($('mcv'), marking);
}
function markErase() { markTool(true); }
function markDraw() { markTool(false); }

/** Shows the new marks right away; the upload runs in the background. */
function markSave() {
  var m = marking, cv = $('mcv');
  redraw(cv, m);
  var f = { photo: cv.toDataURL('image/jpeg', 0.85), strokes: m.strokes };
  if (m.strokes.length) f.original = m.base.toDataURL('image/jpeg', 0.85);
  else f.photo = m.base.toDataURL('image/jpeg', 0.85);
  var thumb = (function () { var t = document.createElement('canvas'), k = 800 / Math.max(cv.width, cv.height); t.width = Math.round(cv.width * k); t.height = Math.round(cv.height * k); t.getContext('2d').drawImage(cv, 0, 0, t.width, t.height); return t.toDataURL('image/jpeg', 0.8); })();
  markClose();
  var el = document.querySelector('.pic .img[data-i="' + m.i + '"]');
  if (el) el.style.backgroundImage = 'url(' + thumb + ')';
  toast('Saving marks…');
  queue = queue.then(function () {
    return call('updateStep', m.folderId, m.i, f);
  }).then(function (n) {
    var s = n.steps[m.i];
    if (s && s.photoId) thumbs[s.photoId] = thumb;
    if (padSop && padSop.folderId === m.folderId) padSop.steps = n.steps;
    toast('Marks saved ✓');
  }).catch(function (e) { toast('Marks not saved: ' + e.message, true); });
}

// ---------- Image helpers ----------

/** Draws an image/video into a new canvas, long side at most MAX_SIDE. */
function scaled(src, w, h) {
  var s = Math.min(1, MAX_SIDE / Math.max(w, h));
  var c = document.createElement('canvas');
  c.width = Math.round(w * s);
  c.height = Math.round(h * s);
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  return c;
}

function loadSrc(src) {
  return new Promise(function (ok, no) {
    var img = new Image();
    img.onload = function () { ok(scaled(img, img.naturalWidth, img.naturalHeight)); };
    img.onerror = function () { no(new Error('bad image')); };
    img.src = src;
  });
}

// ---------- Waiting pictures stay on the phone (IndexedDB) so a closed app doesn't lose them ----------

var dbp = null;
function db(op, arg) {
  if (!window.indexedDB) return Promise.resolve([]);
  dbp = dbp || new Promise(function (ok, no) {
    var r = indexedDB.open('sopNotes', 1);
    r.onupgradeneeded = function () { r.result.createObjectStore('held', { keyPath: 'id' }); };
    r.onsuccess = function () { ok(r.result); };
    r.onerror = function () { no(r.error); };
  });
  return dbp.then(function (d) {
    return new Promise(function (ok, no) {
      var st = d.transaction('held', op === 'all' ? 'readonly' : 'readwrite').objectStore('held');
      var q = op === 'all' ? st.getAll() : op === 'put' ? st.put(arg) : st.delete(arg);
      q.onsuccess = function () { ok(q.result); };
      q.onerror = function () { no(q.error); };
    });
  }).catch(function () { return []; });
}

// ---------- Start ----------

if (!KEY) {
  document.body.innerHTML = '<p class="empty">Open this with your private SOP link.</p>';
} else {
  startCamera();
  paintTop();
  if (localStorage.getItem('micOn')) { autoMic = true; setMic(true); }
  db('all').then(function (items) {
    held = (items || []).sort(function (a, b) { return a.id < b.id ? -1 : 1; });
    held.forEach(function (i) { if (!i.lid && cur) i.lid = cur.lid; sopOf(i); });   // from before v2.3
    paintTop();
  });
  // Leaving the app: keep the picture being marked, upload. Coming back: straight to the live camera of the
  // same SOP (notepad closed), mic back on if it was on, so he can shoot the moment the phone is unlocked.
  var micWas = false;
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) {
      micWas = micOn;
      if (shot) keepShot();
      setMic(false, true);
      localStorage.setItem('micOn', micWas ? '1' : '');
      stopCamera();
      flush();
    } else {
      if ($('pad').style.display === 'block') { $('pad').style.display = 'none'; padSop = null; }
      nextShot();   // picked camera roll pictures not marked yet come back first
      if (micWas) { autoMic = true; setMic(true); }
    }
  });
}
</script>
